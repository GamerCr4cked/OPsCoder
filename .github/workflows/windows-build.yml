name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile application
        run: npm run build

      - name: Create Windows installer
        run: npm run dist:win

      # Keep the ZIP artifact for CI diagnostics and short-term fallback.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPsCoder-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7

      # Publish the raw EXE as a downloadable asset on the rolling
      # continuous-build release. Pull-request builds never publish releases.
      - name: Publish installer to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: OPsCoder — Latest Continuous Build
          prerelease: true
          make_latest: false
          files: release/*.exe
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: false
